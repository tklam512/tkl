<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101116">
  <title>Đăng nhập quản trị | UCC</title>
  <link rel="icon" href="/assets/ucc/logo.png" type="image/png">
  <link rel="preload" href="/assets/ucc/montserrat-vietnamese.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/assets/ucc/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/public.css?v=my-tickets-20261020">
  <link rel="stylesheet" href="./login.css?v=utc-logo-20261019">
</head>
<body>
  <a class="skip-link" href="#main">Đến nội dung chính</a>
  <header class="admin-login-header">
    <a class="admin-brand" href="/" aria-label="UCC, trang chủ"><img src="/assets/ucc/logo.png" alt="UTC Cinema" width="160" height="56"></a>
    <a class="return-link" href="/">← Về website</a>
  </header>
  <main id="main" class="admin-login-main">
    <section class="auth-panel" aria-labelledby="login-title">
      <h1 id="login-title">Đăng nhập quản trị</h1>
      <p class="auth-intro">Quản lý phim, suất chiếu và vận hành rạp.</p>
      <form id="loginForm">
        <label for="username">Tên tài khoản
          <input id="username" name="username" type="text" placeholder="Nhập tên tài khoản" autocomplete="username" required>
        </label>
        <label for="password">Mật khẩu
          <input id="password" name="password" type="password" placeholder="Nhập mật khẩu" autocomplete="current-password" required minlength="6" aria-describedby="passwordHint">
          <span class="field-error" id="passwordHint">Mật khẩu phải từ 6 ký tự trở lên.</span>
        </label>
        <p class="login-error" id="loginError" role="alert">Tên tài khoản hoặc mật khẩu không đúng.</p>
        <button class="button button-primary" type="submit">Đăng nhập</button>
      </form>
      <p class="admin-login-note">Sử dụng tài khoản quản trị được cấp.</p>
    </section>
  </main>
  <footer class="admin-login-footer">UTC Cinema Center · UCC</footer>
  <script src="./login.js"></script>
</body>
</html>
