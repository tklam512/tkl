<!DOCTYPE html>
<html lang="vi">
<head>
  <link rel="icon" href="/assets/ucc/logo.png" type="image/png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng quan</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../styles.css?v=admin-shell-20261019">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="tongquan.css?v=admin-shell-20261019">
</head>
<body class="admin-page">
<div class="main-wrapper">

    <main>
    <header class="overview-header">
        <h1>Xin chào, <span>Quản trị viên.</span></h1>
        <time id="overviewDate" aria-label="Ngày và giờ hiện tại"></time>
    </header>
    <div class="stats-container">
        <a class="stat-card" href="/admin/movies/" target="_top">
            <i class="stat-watermark fa-solid fa-film" aria-hidden="true"></i>
            <div class="stat-icon">
                <i class="fa-solid fa-film"></i>
            </div>
            <div class="stat-content">
                <span class="stat-title">Tổng số phim</span>
                <span class="stat-number" id="totalMovies">0</span>
            </div>
        </a>

        <a class="stat-card" id="showingLink" href="/admin/showtimes/" target="_top">
            <i class="stat-watermark fa-solid fa-ticket" aria-hidden="true"></i>
            <div class="stat-icon">
                <i class="fa-solid fa-ticket"></i>
            </div>
            <div class="stat-content">
                <span class="stat-title">Đang chiếu</span>
                <span class="stat-number" id="showingMovies">0</span>
            </div>
        </a>

        <a class="stat-card" href="/admin/booking/" target="_top">
            <i class="stat-watermark fa-solid fa-credit-card" aria-hidden="true"></i>
            <div class="stat-icon">
                <i class="fa-solid fa-credit-card"></i>
            </div>
            <div class="stat-content">
                <span class="stat-title">Tổng đặt vé</span>
                <span class="stat-number" id="totalBookings">0</span>
            </div>
        </a>

        <div class="stat-card">
            <i class="stat-watermark fa-solid fa-users" aria-hidden="true"></i>
            <div class="stat-icon">
                <i class="fa-solid fa-users"></i>
            </div>
            <div class="stat-content">
                <span class="stat-title">Người dùng</span>
                <span class="stat-number">3</span>
            </div>
        </div>
    </div>
    </main>
    </div>
<script src="../app.js?v=rooms-20261019"></script>
<script src="../../shared-state.js?v=my-tickets-20261020"></script>
    <script src="tongquan.js"></script>

</body>
</html>
